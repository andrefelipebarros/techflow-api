name: Desktop Windows executable

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  exe:
    name: Gerar TechFlow.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar o jar
        shell: cmd
        run: call build.bat

      - name: Empacotar o .exe com o Java embutido
        shell: cmd
        run: >
          jpackage --type app-image --name TechFlow --input dist
          --main-jar TechFlow.jar --main-class com.alipe.techflow.desktop.Main
          --icon packaging\techflow.ico --app-version 1.0.0
          --vendor "Andre Felipe de Barros"
          --description "Interface desktop da TechFlow API"
          --java-options "-Dfile.encoding=UTF-8" --dest dist-exe

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist-exe\TechFlow -DestinationPath TechFlow-windows.zip

      - name: Gerar o instalador (opcional)
        continue-on-error: true
        shell: cmd
        run: >
          jpackage --type exe --name TechFlow --input dist
          --main-jar TechFlow.jar --main-class com.alipe.techflow.desktop.Main
          --icon packaging\techflow.ico --app-version 1.0.0
          --vendor "Andre Felipe de Barros"
          --java-options "-Dfile.encoding=UTF-8"
          --win-menu --win-shortcut --win-dir-chooser --dest installer

      - name: Guardar os arquivos
        uses: actions/upload-artifact@v7
        with:
          name: TechFlow-windows
          path: |
            desktop/TechFlow-windows.zip
            desktop/installer/*.exe
            desktop/dist/TechFlow.jar
          if-no-files-found: warn

      - name: Anexar à release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @("TechFlow-windows.zip", "dist\TechFlow.jar")
          if (Test-Path installer) { $files += (Get-ChildItem installer\*.exe).FullName }
          gh release create "${{ github.ref_name }}" @files --title "TechFlow Desktop ${{ github.ref_name }}" --generate-notes

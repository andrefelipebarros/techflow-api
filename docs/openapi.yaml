openapi: 3.0.3
info:
  title: TechFlow API
  version: 1.0.0
  description: API REST para gerenciamento de projetos e tarefas.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      security: []
      summary: Cadastra usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': {description: Usuário criado e token emitido}
        '400': {description: Dados inválidos}
  /api/v1/auth/login:
    post:
      security: []
      summary: Autentica usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': {description: Token emitido}
        '401': {description: Credenciais inválidas}
  /api/v1/users/me:
    get:
      summary: Retorna usuário autenticado
      responses:
        '200': {description: Usuário atual}
  /api/v1/projects:
    get:
      summary: Lista projetos do usuário
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
      responses:
        '200': {description: Página de projetos}
    post:
      summary: Cria projeto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201': {description: Projeto criado}
  /api/v1/projects/{id}:
    get:
      summary: Busca projeto do usuário
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: Projeto}
        '404': {description: Não encontrado}
    put:
      summary: Atualiza projeto
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200': {description: Projeto atualizado}
    delete:
      summary: Remove projeto
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '204': {description: Removido}
  /api/v1/projects/{projectId}/tasks:
    post:
      summary: Cria tarefa no projeto
      parameters:
        - in: path
          name: projectId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201': {description: Tarefa criada}
    get:
      summary: Lista tarefas do projeto
      parameters:
        - in: path
          name: projectId
          required: true
          schema: {type: integer, format: int64}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
      responses:
        '200': {description: Página de tarefas}
  /api/v1/tasks/{taskId}:
    get:
      summary: Busca tarefa
      parameters: [{$ref: '#/components/parameters/taskId'}]
      responses:
        '200': {description: Tarefa}
    put:
      summary: Atualiza tarefa
      parameters: [{$ref: '#/components/parameters/taskId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200': {description: Tarefa atualizada}
    delete:
      summary: Remove tarefa
      parameters: [{$ref: '#/components/parameters/taskId'}]
      responses:
        '204': {description: Removida}
  /api/v1/tasks/{taskId}/status:
    put:
      summary: Altera status da tarefa
      parameters: [{$ref: '#/components/parameters/taskId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [TODO, IN_PROGRESS, DONE, CANCELED]}
      responses:
        '200': {description: Status alterado}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      in: path
      name: id
      required: true
      schema: {type: integer, format: int64}
    taskId:
      in: path
      name: taskId
      required: true
      schema: {type: integer, format: int64}
    page:
      in: query
      name: page
      schema: {type: integer, default: 0}
    size:
      in: query
      name: size
      schema: {type: integer, default: 20, maximum: 100}
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, maxLength: 120, example: Alice Silva}
        email: {type: string, format: email, example: alice@example.com}
        password: {type: string, format: password, minLength: 8, example: Senha@123}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    ProjectRequest:
      type: object
      required: [name, status]
      properties:
        name: {type: string, maxLength: 150}
        description: {type: string, maxLength: 1000}
        status: {type: string, enum: [PLANNED, IN_PROGRESS, COMPLETED, ARCHIVED]}
    TaskRequest:
      type: object
      required: [title, priority]
      properties:
        title: {type: string, maxLength: 180}
        description: {type: string, maxLength: 2000}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH, URGENT]}
        dueDate: {type: string, format: date}
